<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temp Master Dashboard</title>
    <script>
      (() => {
        let storedTheme;
        try {
          storedTheme = window.localStorage.getItem('temp-master-theme');
        } catch {
          storedTheme = null;
        }

        let prefersDark = false;
        try {
          prefersDark =
            window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        } catch {
          prefersDark = false;
        }

        document.documentElement.dataset.theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : prefersDark
              ? 'dark'
              : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
