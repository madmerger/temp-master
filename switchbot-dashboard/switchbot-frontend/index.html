<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Temp Master Dashboard</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("temp-master-theme");
        const theme =
          savedTheme === "light" || savedTheme === "dark" || savedTheme === "aurora"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
