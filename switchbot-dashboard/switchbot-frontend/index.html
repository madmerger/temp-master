<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temp Master Dashboard</title>
    <script>
      // ちらつき防止のため、React の描画前にテーマを適用する
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('temp-master-theme');
        } catch (e) {
          // localStorage が使えない環境では OS の設定にフォールバックする
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
