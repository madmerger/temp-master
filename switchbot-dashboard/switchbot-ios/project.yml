name: SwitchBotDashboard
options:
  bundleIdPrefix: com.madmerger.tempmaster
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
packages:
  SwitchBotCore:
    path: SwitchBotCore
targets:
  SwitchBotDashboard:
    type: application
    platform: iOS
    sources:
      - path: SwitchBotDashboard
      - path: ../display_names.json
        buildPhase: resources
    dependencies:
      - package: SwitchBotCore
        product: SwitchBotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madmerger.tempmaster.SwitchBotDashboard
        INFOPLIST_KEY_CFBundleDisplayName: Temp Master Dashboard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  SwitchBotDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SwitchBotDashboardUITests
    dependencies:
      - target: SwitchBotDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madmerger.tempmaster.SwitchBotDashboardUITests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  SwitchBotDashboard:
    build:
      targets:
        SwitchBotDashboard: all
        SwitchBotDashboardUITests: [test]
    test:
      targets:
        - SwitchBotDashboardUITests
