name: TempMaster
options:
  bundleIdPrefix: com.madmerger
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - ja
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TempMaster:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TempMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madmerger.TempMaster
        INFOPLIST_FILE: TempMaster/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    dependencies: []

  TempMasterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TempMasterTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madmerger.TempMasterTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: TempMaster

  TempMasterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TempMasterUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madmerger.TempMasterUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TempMaster
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: TempMaster

schemes:
  TempMaster:
    build:
      targets:
        TempMaster: all
        TempMasterTests: [test]
        TempMasterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TempMasterTests
        - TempMasterUITests
