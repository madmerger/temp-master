name: Windows Dashboard

on:
  pull_request:
    paths:
      - switchbot-dashboard/switchbot-windows/**
      - switchbot-dashboard/display_names.json
      - .github/workflows/windows.yml
  push:
    branches:
      - main
    paths:
      - switchbot-dashboard/switchbot-windows/**
      - switchbot-dashboard/display_names.json
      - .github/workflows/windows.yml

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test Windows dashboard
        shell: pwsh
        run: .\switchbot-dashboard\switchbot-windows\run-ui-tests.ps1
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashboard-test-results
          path: switchbot-dashboard/switchbot-windows/TestResults/
