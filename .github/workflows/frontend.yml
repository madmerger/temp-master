name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'switchbot-dashboard/switchbot-frontend/**'
      - 'switchbot-dashboard/Dockerfile'
      - 'switchbot-dashboard/.dockerignore'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'switchbot-dashboard/switchbot-frontend/**'
      - 'switchbot-dashboard/Dockerfile'
      - 'switchbot-dashboard/.dockerignore'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: switchbot-dashboard/switchbot-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: switchbot-dashboard/switchbot-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t temp-master:ci switchbot-dashboard
